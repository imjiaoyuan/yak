name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}
      - run: cargo test
      - name: Extension content layouts
        run: python .github/extension_layout_test.py
      - name: Extension behavior
        shell: bash
        run: |
          failed=()
          for test in retrieval_extensions; do
            if ! python .github/${test}_test.py; then failed+=("${test}"); fi
          done
          if (( ${#failed[@]} )); then echo "failed: ${failed[*]}"; exit 1; fi
      - run: cargo build --release
      - name: End-to-end smoke
        run: python .github/ci_e2e.py target/release/yak${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      - name: Interactive REPL smoke
        run: python .github/ci_repl.py target/release/yak${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      - name: Native provider smoke
        run: python .github/provider_e2e.py target/release/yak${{ matrix.os == 'windows-latest' && '.exe' || '' }}
      - name: Workflow extension smoke
        run: python .github/wf_e2e.py target/release/yak${{ matrix.os == 'windows-latest' && '.exe' || '' }}
