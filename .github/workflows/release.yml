name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build release notes from the commits on this tag
        run: |
          PREV=$(git describe --tags --abbrev=0 '${{ github.ref_name }}^' 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            RANGE="$PREV..${{ github.ref_name }}"
          else
            RANGE="${{ github.ref_name }}"
          fi
          {
            git log --format='- %s' "$RANGE" | grep -vEi '^- (bump( the)? version( to)?|release) v?[0-9]' || true
            echo
            echo '**Install / update:**'
            echo
            echo '```bash'
            echo 'curl -fsSL https://jiaoyuan.org/yak/install.sh | sh'
            echo '```'
          } > body.md
      # the taiki-e action's `changelog` input expects a parse-changelog
      # file (versioned sections), which free-form notes are not: create the
      # release bare and write the generated notes with gh instead
      - uses: taiki-e/create-gh-release-action@v1
      - name: Publish the generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit '${{ github.ref_name }}' --notes-file body.md

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # cross-compiled on the x86_64 runner via the cross tool (docker)
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, tool: cross }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
      - run: cargo test
      - name: Windows non-interactive smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $env:YAK_USER_PATH = Join-Path $env:RUNNER_TEMP "yak-smoke"
          cargo run --quiet -- --version
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: yak
          target: ${{ matrix.target }}
          build-tool: ${{ matrix.tool }}
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
