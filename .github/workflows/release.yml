name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/create-gh-release-action@v1

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          # cross-compiled on the x86_64 runner via the cross tool (docker)
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, tool: cross }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
      - run: cargo test
      - name: Windows non-interactive smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $env:LLM_USER_PATH = Join-Path $env:RUNNER_TEMP "llm-smoke"
          cargo run --quiet -- --version
      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: llm
          target: ${{ matrix.target }}
          tool: ${{ matrix.tool }}
          tar: unix
          zip: windows
          checksum: sha256
          locked: true
